spring:
  application:
    name: RAGdemo
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  elasticsearch:
    uris: http://localhost:9200
  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      chat:
        base-url: https://api.deepseek.com
        model: deepseek-chat
        temperature: 0.5
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        options:
          model: qwen3.7-text-embedding
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: rag-document-index
        dimensions: 1024
        similarity: cosine